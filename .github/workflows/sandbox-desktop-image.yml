name: Sandbox desktop image

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox-desktop-image.yml"
      - "packages/tool-sandbox/images/desktop/**"
      - "packages/tool-sandbox/src/daemon/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit GHCR image tag, for example 0.1.0 or 0.1.0-rc.1"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/anvia-hq/sandbox-desktop

jobs:
  build:
    name: Build sandbox desktop image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The image installs @anvia/sandbox from a tarball of this checkout, not from npm, so it
      # always carries the daemon from the commit it was built from.
      - name: Build the daemon package and prepare the image context
        run: |
          set -eu
          pnpm --filter @anvia/sandbox build
          context="$RUNNER_TEMP/desktop-image"
          mkdir -p "$context"
          pnpm --filter @anvia/sandbox exec pnpm pack --pack-destination "$context" >/dev/null
          cp -R packages/tool-sandbox/images/desktop/. "$context/"
          echo "ANVIA_IMAGE_CONTEXT=$context" >> "$GITHUB_ENV"
          echo "ANVIA_IMAGE_TARBALL=$(cd "$context" && ls anvia-sandbox-*.tgz)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.ANVIA_IMAGE_CONTEXT }}
          platforms: linux/amd64
          push: false
          load: true
          build-args: ANVIA_SANDBOX_PACKAGE=/ctx/${{ env.ANVIA_IMAGE_TARBALL }}
          tags: ${{ env.IMAGE }}:validation
          cache-from: type=gha,scope=sandbox-desktop-image
          cache-to: type=gha,mode=max,scope=sandbox-desktop-image

      - name: Check the image carries what the desktop needs
        run: |
          docker run --rm -i --entrypoint sh "$IMAGE:validation" -s <<'CHECK'
          set -eu
          for program in Xvnc vncconfig xdotool xrandr import openbox-session plank picom \
            chromium anvia-chromium tmux lxterminal pcmanfm anvia-sandbox-daemon; do
            command -v "$program" >/dev/null || { echo "missing: $program" >&2; exit 1; }
          done
          node -e "require('node-pty')"
          # Started without its settings, the daemon loads and says what it needs.
          anvia-sandbox-daemon 2>&1 | grep -q ANVIA_CONTROL_URL
          CHECK

  publish:
    name: Publish sandbox desktop image
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the daemon package and prepare the image context
        run: |
          set -eu
          pnpm --filter @anvia/sandbox build
          context="$RUNNER_TEMP/desktop-image"
          mkdir -p "$context"
          pnpm --filter @anvia/sandbox exec pnpm pack --pack-destination "$context" >/dev/null
          cp -R packages/tool-sandbox/images/desktop/. "$context/"
          echo "ANVIA_IMAGE_CONTEXT=$context" >> "$GITHUB_ENV"
          echo "ANVIA_IMAGE_TARBALL=$(cd "$context" && ls anvia-sandbox-*.tgz)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve explicit image tags
        id: tags
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "$DISPATCH_TAG" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid image tag: $DISPATCH_TAG" >&2
              exit 1
              ;;
          esac
          {
            echo "tags<<EOF"
            echo "$IMAGE:$DISPATCH_TAG"
            case "$DISPATCH_TAG" in
              *-rc.*) echo "$IMAGE:rc" ;;
              *-*) ;;
              *) echo "$IMAGE:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.ANVIA_IMAGE_CONTEXT }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: ANVIA_SANDBOX_PACKAGE=/ctx/${{ env.ANVIA_IMAGE_TARBALL }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=sandbox-desktop-image
          cache-to: type=gha,mode=max,scope=sandbox-desktop-image
