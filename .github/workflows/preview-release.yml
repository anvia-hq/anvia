name: Publish Preview Packages

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-preview-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish preview packages to npm
    runs-on: ubuntu-latest
    environment: npm-preview

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require staging branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "Preview package publishing must run from the staging branch."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Build core package
        run: pnpm --filter @anvia/core build

      - name: Build remaining packages
        run: pnpm --filter './packages/**' --filter '!@anvia/core' build

      - name: Typecheck packages
        run: pnpm --filter './packages/**' typecheck

      - name: Test packages
        run: pnpm --filter './packages/**' test

      - name: Publish preview packages
        run: pnpm preview:release
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED_PACKAGES_FILE: .published-packages.json

      - name: Notify Discord
        continue-on-error: true
        run: node scripts/notify-discord-release.mjs preview
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PREVIEW_RELEASE_WEBHOOK_URL }}
          PUBLISHED_PACKAGES_FILE: .published-packages.json
