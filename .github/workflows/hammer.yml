name: Hammer Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: hammer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets on `pull_request`; hammer-fork-review.yml reviews those.
    if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    steps:
      - uses: anvia-hq/hammer@8072b1d8c28bf50603f4e714aed8ba579f1e7738 # v1
        with:
          client: claude-agent-sdk
          model: claude-sonnet-5-5
          reasoning-effort: high
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          hammer-api-key: ${{ secrets.HAMMER_API_KEY }}
