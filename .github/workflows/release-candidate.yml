name: Publish Release Candidate Packages

on:
  push:
    tags:
      - "v1.0.0-rc.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: package-rc-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish synchronized RC packages to npm
    runs-on: ubuntu-latest
    environment: npm-rc
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch staging
        run: git fetch origin staging:refs/remotes/origin/staging

      - name: Validate tag and release state
        run: node scripts/validate-release-train.mjs --tag "${GITHUB_REF_NAME}" --require-staging-ancestor

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release infrastructure
        run: pnpm test:release-scripts

      - name: Check formatting and linting
        run: pnpm check

      - name: Build core package
        run: pnpm --filter @anvia/core build

      - name: Build remaining packages
        run: pnpm --filter './packages/**' --filter '!@anvia/core' build

      - name: Verify packed internal versions
        run: pnpm release-train:verify-packs

      - name: Typecheck packages
        run: pnpm --filter './packages/**' typecheck

      - name: Typecheck examples
        run: pnpm --filter './examples/**' typecheck

      - name: Test packages
        run: pnpm --filter './packages/**' test

      - name: Publish release candidate packages
        run: node scripts/publish-packages.mjs --tag rc
        env:
          NPM_CONFIG_PROVENANCE: true
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED_PACKAGES_FILE: .published-packages.json

      - name: Push package release tags
        run: git push origin --tags

      - name: Create prerelease GitHub Releases
        run: pnpm github-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        continue-on-error: true
        run: node scripts/notify-discord-release.mjs rc
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RC_RELEASE_WEBHOOK_URL }}
          PUBLISHED_PACKAGES_FILE: .published-packages.json
