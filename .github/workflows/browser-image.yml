name: Browser image

on:
  pull_request:
    paths:
      - ".github/workflows/browser-image.yml"
      - "packages/tool-browser/image/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit GHCR image tag"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/anvia-hq/browser

jobs:
  build:
    name: Build browser image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/tool-browser/image
          file: packages/tool-browser/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:validation
          cache-from: type=gha,scope=browser-image
          cache-to: type=gha,mode=max,scope=browser-image

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test browser image
        env:
          ANVIA_BROWSER_DOCKER_TESTS: "1"
          ANVIA_BROWSER_TEST_IMAGE: ${{ env.IMAGE }}:validation
        run: pnpm --filter @anvia/browser test

  publish:
    name: Publish browser image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve explicit image tags
        id: tags
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          tag="${DISPATCH_TAG:-$GIT_TAG}"
          case "$tag" in
            *[!A-Za-z0-9._-]*|'')
              echo "Invalid image tag: $tag" >&2
              exit 1
              ;;
          esac
          {
            echo "tags<<EOF"
            echo "$IMAGE:$tag"
            case "$tag" in
              *-rc.*) echo "$IMAGE:rc" ;;
              v*) echo "$IMAGE:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/tool-browser/image
          file: packages/tool-browser/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=browser-image
          cache-to: type=gha,mode=max,scope=browser-image
