name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Validate package releases
        run: pnpm releases:validate

      - name: Test release infrastructure
        run: pnpm test:release-scripts

      - name: Build core package
        run: pnpm --filter @anvia/core build

      - name: Build remaining packages
        run: pnpm --filter './packages/**' --filter '!@anvia/core' build

      - name: Verify packed internal versions
        run: pnpm releases:verify-packs

      - name: Typecheck packages
        run: pnpm --filter './packages/**' typecheck

      - name: Typecheck cookbook and internal tests
        run: pnpm --filter cookbook --filter './tests/**' typecheck

      - name: Test packages
        run: pnpm --filter './packages/**' test

  bun-compatibility:
    name: Bun compatibility (${{ matrix.bun-version }})
    strategy:
      matrix:
        bun-version: ["1.3.14", "1.x"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test built packages with Bun
        run: pnpm --filter bun-runtime-compat test:bun

      - name: Typecheck Bun compatibility workspace
        run: pnpm --filter bun-runtime-compat typecheck

  prisma-memory:
    name: Prisma 7 and 8 memory (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ANVIA_PRISMA_TEST_URL: postgresql://postgres@127.0.0.1:5432/postgres
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anvia/core build
      - run: pnpm --filter @anvia/memory-prisma build
      - run: pnpm --filter memory-prisma-integration test:postgres
      - run: pnpm --filter memory-prisma-integration exec tsc --noEmit
