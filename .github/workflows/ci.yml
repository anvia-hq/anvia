name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and linting
        run: pnpm check

      - name: Validate package releases
        run: pnpm releases:validate

      - name: Test release infrastructure
        run: pnpm test:release-scripts

      - name: Build core package
        run: pnpm --filter @anvia/core build

      - name: Build remaining packages
        run: pnpm --filter './packages/**' --filter '!@anvia/core' build

      - name: Verify packed internal versions
        run: pnpm releases:verify-packs

      - name: Typecheck packages
        run: pnpm --filter './packages/**' typecheck

      - name: Typecheck cookbook and internal tests
        run: pnpm --filter cookbook --filter './tests/**' typecheck

      - name: Test packages
        run: pnpm --filter './packages/**' test
