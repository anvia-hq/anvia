<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anvia Studio</title>
    <meta
      name="description"
      content="Professional Studio interface for Anvia agents, sessions, tools, knowledge, and traces."
    />
    <meta name="theme-color" content="#09090b" />
    <link data-anvia-favicon rel="icon" type="image/svg+xml" href="/ui/assets/favicon-dark.svg" />
    <script>
      (() => {
        let theme = "dark";
        try {
          const stored = localStorage.getItem("anvia-theme");
          const legacy = localStorage.getItem("anvia-studio-theme");
          if (stored === "light" || (stored !== "dark" && legacy === "light")) theme = "light";
        } catch {}
        const root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#09090b" : "#f4f4f5");
        const favicon = document.querySelector("link[data-anvia-favicon]");
        if (favicon)
          favicon.href = favicon.href.replace("favicon-dark.svg", `favicon-${theme}.svg`);
      })();
    </script>
  </head>
  <body>
    <div id="anvia-ui" data-ui-path="/ui">
      <main class="shell-loading">
        <div class="studio-logo-lockup">
          <img
            class="studio-logo-image"
            src="/ui/assets/logo.png"
            alt="Anvia"
            width="984"
            height="206"
          />
          <span class="studio-logo-badge">Studio</span>
        </div>
      </main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
