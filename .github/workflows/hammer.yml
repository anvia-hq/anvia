name: Hammer Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: anvia-hq/hammer@7330e2924b1451d7d2b2ca9b877af60e04ce6181 # v1
        with:
          client: anthropic
          model: claude-sonnet-5-5
          api-key: ${{ secrets.MODEL_API_KEY }}
          hammer-api-key: ${{ secrets.HAMMER_API_KEY }}
