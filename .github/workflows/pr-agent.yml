name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' && !github.event.pull_request.draft }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR-Agent review
        uses: the-pr-agent/pr-agent@v0.47.0
        env:
          OPENAI_KEY: ${{ secrets.DEVSCALE_API_KEY }}
          OPENAI.API_BASE: https://gateway.devscale.id/v1
          config.model: openai/deepseek-v4.1-flash
          config.custom_model_max_tokens: 128000
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
